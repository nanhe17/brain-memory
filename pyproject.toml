[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brain-memory"
version = "0.1.0"
description = "Brain-inspired long-term memory architecture for AI agents (Phase 1 MVP)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "memory" }]
keywords = ["agent", "memory", "episodic", "retrieval", "llm"]
dependencies = [
    "pydantic>=2.5",
    "numpy>=1.26",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27"]

[project.scripts]
brain-memory-demo = "brain_memory.demo:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
